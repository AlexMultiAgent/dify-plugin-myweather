# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Actions pinned by the CI workflow (actions/checkout, actions/setup-python,
  # astral-sh/setup-uv, actions/upload-artifact, ...).
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python dependencies. The "uv" ecosystem updates pyproject.toml and uv.lock
  # together; the "pip" ecosystem patches pyproject.toml only and leaves
  # uv.lock stale, which breaks the `uv sync --locked` CI step.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    ignore:
      # The runtime dependencies are exported into requirements.txt, which ships
      # inside the .difypkg. The plugin daemon installs them from its own
      # package mirror, which lags PyPI, so bumping one can break installation
      # for every user. Upgrade them by hand once the daemon mirror has caught
      # up.
      - dependency-name: "dify-plugin"
      - dependency-name: "regex"
      - dependency-name: "requests"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      python-major:
        patterns:
          - "*"
        update-types:
          - "major"
