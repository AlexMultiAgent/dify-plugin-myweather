# CodeQL analysis. Free for public repositories -- no Advanced Security
# license needed. Runs on every push and pull request to main, plus a weekly
# cron so that newly published queries are applied to code that has not
# changed since the last run.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Off-peak minute on purpose: many repos share the top-of-hour crons.
    - cron: "27 4 * * 1"

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `security-events: write` lives on the job, not on the workflow: only
    # this job uploads SARIF to code scanning.
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
