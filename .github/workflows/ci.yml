name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Install Dify plugin CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.15/dify-plugin-linux-amd64" \
            --output "${RUNNER_TEMP}/dify"
          chmod +x "${RUNNER_TEMP}/dify"
          "${RUNNER_TEMP}/dify" version
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Test
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Audit runtime dependencies
        run: uv run pip-audit --no-deps --disable-pip -r requirements.txt
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Build runtime package
        working-directory: ..
        run: dify plugin package dify-plugin-myweather -o "dify-plugin-myweather/myweather-${{ steps.release.outputs.version }}.difypkg"
      - name: Verify runtime package
        run: uv run python scripts/verify_package.py "myweather-${{ steps.release.outputs.version }}.difypkg" --source-root .
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: plugin-package
          path: myweather-${{ steps.release.outputs.version }}.difypkg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    # `contents: write` is required here: this job creates the GitHub Release
    # for the tag and uploads the `.difypkg` as a release asset. No other job
    # writes to the repository.
    permissions:
      contents: write
      id-token: write  # Mint the OIDC token for the build provenance attestation.
      attestations: write  # Register the build provenance attestation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: plugin-package
          path: release

      - name: Attest the package
        # The bundle is a Sigstore bundle (mediaType
        # application/vnd.dev.sigstore.bundle.v0.3+json) and is attached to the
        # release as a .sigstore.json asset -- the name Sigstore itself uses for
        # that file. OSSF Scorecard's Signed-Releases check looks for a release
        # asset with that suffix, so the file has to be a genuine bundle and not
        # a renamed one.
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/release/*.difypkg
      - name: Extract release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          start = changelog.index(f"## {version}")
          end = changelog.find("\n## ", start + 1)
          section = changelog[start:end if end != -1 else None]
          notes = section.split("\n", 1)[1].strip()
          if not notes:
              raise SystemExit("release notes section is empty")
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
          test -s release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          package="$(ls release/*.difypkg)"
          signature="release/$(basename "${package%.difypkg}").sigstore.json"
          cp "$BUNDLE" "$signature"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "MyWeather ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" "$package" "$signature" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$package" "$signature" \
              --verify-tag \
              --title "MyWeather ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
