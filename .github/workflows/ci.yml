name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Test
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Audit runtime dependencies
        run: uv run pip-audit --no-deps --disable-pip -r requirements.txt
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Build runtime package
        working-directory: ..
        run: uv run --project dify-plugin-myweather dify plugin package dify-plugin-myweather -o myweather-ci.difypkg
      - name: Verify runtime package
        run: uv run python scripts/verify_package.py ../myweather-ci.difypkg --source-root .
