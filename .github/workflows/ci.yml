name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Test
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Audit runtime dependencies
        run: uv run pip-audit --no-deps --disable-pip -r requirements.txt
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Build runtime package
        working-directory: ..
        run: uv run --project dify-plugin-myweather dify plugin package dify-plugin-myweather -o "dify-plugin-myweather/myweather-${{ steps.release.outputs.version }}.difypkg"
      - name: Verify runtime package
        run: uv run python scripts/verify_package.py "myweather-${{ steps.release.outputs.version }}.difypkg" --source-root .
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: myweather-${{ steps.release.outputs.version }}.difypkg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: release
      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## [0-9]+\.[0-9]+\.[0-9]+/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "MyWeather ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" release/*.difypkg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/*.difypkg \
              --verify-tag \
              --title "MyWeather ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
