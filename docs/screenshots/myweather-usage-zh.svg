<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-label="MyWeather usage screenshot Chinese">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F3FF"/>
      <stop offset="100%" stop-color="#D5E8FF"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A94F5"/>
      <stop offset="100%" stop-color="#2F6FD8"/>
    </linearGradient>
  </defs>
  <rect width="1360" height="820" rx="24" fill="url(#bg)"/>
  <rect x="36" y="36" width="1288" height="72" rx="16" fill="url(#header)"/>
  <text x="72" y="82" font-size="34" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-weight="700" fill="#FFFFFF">MyWeather 插件使用截图（中文）</text>

  <rect x="56" y="146" width="1248" height="632" rx="18" fill="#FFFFFF" stroke="#D2DFF5" stroke-width="2"/>
  <text x="96" y="200" font-size="26" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-weight="700" fill="#18457F">工作流节点：Weather Lookup</text>

  <rect x="96" y="232" width="1168" height="84" rx="12" fill="#F4F8FF" stroke="#D6E2F7"/>
  <text x="126" y="283" font-size="24" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" fill="#203B68">location  =  {{#sys.query#}}</text>

  <rect x="96" y="332" width="560" height="110" rx="12" fill="#F8FBFF" stroke="#D6E2F7"/>
  <text x="126" y="374" font-size="23" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-weight="700" fill="#203B68">units</text>
  <text x="126" y="414" font-size="22" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" fill="#33598F">metric（摄氏度，km/h）</text>

  <rect x="704" y="332" width="560" height="110" rx="12" fill="#F8FBFF" stroke="#9CC0F5" stroke-width="2"/>
  <text x="734" y="374" font-size="23" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-weight="700" fill="#203B68">source_preference</text>
  <text x="734" y="414" font-size="22" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" fill="#1E53A7">open-meteo（默认主源，wttr 兜底）</text>

  <rect x="96" y="458" width="1168" height="110" rx="12" fill="#F8FBFF" stroke="#D6E2F7"/>
  <text x="126" y="500" font-size="23" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-weight="700" fill="#203B68">include_raw_json</text>
  <text x="126" y="540" font-size="22" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" fill="#33598F">false</text>

  <rect x="96" y="586" width="1168" height="152" rx="12" fill="#F2F8FF" stroke="#BAD0F4"/>
  <text x="126" y="628" font-size="23" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-weight="700" fill="#204274">测试提问</text>
  <text x="126" y="666" font-size="22" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" fill="#315983">“深圳现在天气怎么样？”</text>
  <text x="126" y="706" font-size="22" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" fill="#315983">预期：返回天气摘要与来源；主源失败时自动切换兜底源。</text>
</svg>
