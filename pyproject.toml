[project]
name = "dify-weather-plugin"
version = "0.1.2"
description = "Dify weather plugin with multi-language output and switchable primary source (Open-Meteo or wttr.in)."
readme = "README.md"
requires-python = ">=3.12"

# Runtime dependencies are declared in requirements.txt (the Dify marketplace reads that file).
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
exclude = [".venv", "__pycache__", ".pytest_cache", ".git"]
