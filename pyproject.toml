[project]
name = "dify-plugin-myweather"
version = "0.1.4"
description = "Dify weather plugin with multi-language output and switchable primary source (Open-Meteo or wttr.in)."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "dify_plugin>=0.9.0,<1.0.0",
  "requests>=2.32.0,<3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0,<10.0.0",
  "ruff>=0.17.0,<1.0.0",
  "pyright>=1.1.400,<2.0.0",
  "pip-audit>=2.10.0,<3.0.0",
]

[tool.ruff]
# line-length stays at ruff's default (88) -- the tree is already formatted that
# way, and raising it would reformat every file.
target-version = "py312"
exclude = [".venv", "__pycache__", ".pytest_cache", ".git"]

[tool.ruff.lint]
# Pin the default rule set and add isort/pyupgrade/bugbear so a ruff upgrade
# cannot silently change what the gate reports.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
exclude = [".venv", "__pycache__", ".pytest_cache", ".git"]
